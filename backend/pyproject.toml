[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-restaurant-receptionist"
version = "0.1.0"
description = "Production-ready AI restaurant receptionist with local-first architecture"
readme = "README.md"
# Upper-bounded, not just ">=3.11": torch==2.1.1 (pinned below, together
# with the exact kokoro/faster-whisper/piper-tts versions it was
# verified against) has no Python 3.12 wheel — pip's resolver fails
# deep into dependency resolution with a confusing "no matching
# distribution" error rather than a clear "wrong Python version" one
# without this bound. Bumping torch to a 3.12-compatible release isn't
# done here because it would mean re-verifying the whole audio/AI
# provider stack (Kokoro TTS, faster-whisper) against a torch version
# this project has never actually run inference against — a real
# GPU/model-weights verification this sandbox can't do, so it's left
# for whoever next needs Python 3.12 support specifically.
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [
    {name = "Burak Yilmaz", email = "yilmmazburak@gmail.com"}
]

dependencies = [
    # Web Framework
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",

    # Database
    "sqlalchemy==2.0.23",
    "asyncpg==0.30.0",
    "alembic==1.12.1",
    "python-dateutil==2.8.2",  # required by alembic's file_template timezone support

    # Async / Cache
    # Note: aioredis is deprecated and abandoned upstream; on Python 3.11+
    # it crashes at import time (duplicate TimeoutError base class vs the
    # stdlib). redis-py >=4.2 ships the same asyncio API as `redis.asyncio`,
    # so that's what app/core/cache.py uses instead.
    "redis==5.0.1",

    # Data Validation
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",

    # Security
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.1.1",

    # HTTP Client
    "httpx==0.25.1",
    "aiohttp==3.9.1",

    # AI/ML
    # Note: no "ollama" package here — OllamaLLMProvider talks to
    # Ollama's REST API directly via httpx (already a dependency below),
    # never the ollama-python client library, so it isn't needed.
    #
    # Not faster-whisper==0.10.0: it pins an old `av` version with no
    # prebuilt wheel for current platforms, so pip tries to compile it
    # from source and fails without libavformat/libavcodec/... *development*
    # headers — plain `apt-get install ffmpeg` (runtime libraries only)
    # doesn't provide those, so this would fail the same way inside the
    # Docker build too.
    "faster-whisper==1.2.1",
    "transformers==4.36.0",
    "torch==2.1.1",
    "numpy==1.26.3",

    # Vector DB
    "chromadb==0.4.21",

    # TTS
    "kokoro==0.9.4",
    # 1.7.0, not the older 1.2.0: the AudioChunk-based synthesize() API
    # this project's PiperTTSProvider is written against (audio_int16_bytes,
    # voice.config.sample_rate) doesn't exist in 1.2.0, which instead
    # streams raw bytes via a differently-named synthesize_stream_raw().
    "piper-tts==1.7.0",

    # Audio Processing
    # (WAV container handling uses the stdlib `wave` module directly —
    # no separate package needed for that.)
    "librosa==0.10.0",
    "soundfile==0.12.1",

    # Telephony
    "twilio==8.10.0",

    # Monitoring
    "prometheus-client==0.19.0",

    # Logging
    "python-json-logger==2.0.7",

    # Utilities
    "python-dotenv==1.0.0",
    "pyyaml==6.0.1",
    "tenacity==8.2.3",

    # Email
    "aiosmtplib==3.0.1",
    "email-validator==2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "black==23.12.0",
    "ruff==0.1.8",
    "mypy==1.7.1",
    "types-redis==4.6.0.11",
    "types-aiofiles==23.2.0",
    "httpx[cli]==0.25.1",
    # The async SQLite driver every test's db_engine fixture uses
    # (sqlite+aiosqlite:///:memory:) — test-only, never used in
    # production (which always talks to Postgres via asyncpg), so it
    # belongs here rather than in the main dependency list. Found
    # missing entirely: it was already installed in this project's dev
    # environment from some earlier ad hoc `pip install`, which is the
    # only reason `pytest` had been passing at all — a genuinely clean
    # `pip install -e ".[dev]"` would have failed to even import the
    # test suite's own fixtures.
    "aiosqlite==0.22.1",
]

[tool.setuptools.packages.find]
# Without this, setuptools' automatic flat-layout discovery finds two
# top-level directories that look like packages (app/, alembic/) and
# refuses to guess which one this distribution actually is — a hard
# error on modern setuptools (>=61), not just a warning: `pip install
# -e ".[dev]"` fails outright with "Multiple top-level packages
# discovered in a flat-layout" before installing anything at all. Only
# `app` (and its subpackages) is the actual installable package;
# `alembic/` is invoked directly via the `alembic` CLI reading
# alembic.ini/env.py in place, never imported as a library, and
# `tests/` should never ship in a built wheel regardless.
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
select = [
    "E",   # Pycodestyle errors
    "W",   # Pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
# E501 (line too long) is redundant with the line-length setting above;
# W503 (line break before binary operator) doesn't exist as a ruff rule
# code — it's a flake8-only code for a style flake8 itself now considers
# non-idiomatic — so listing it here made ruff refuse to start at all.
# B008 (function call in argument default) is FastAPI's own `Depends(...)`
# idiom — it's how dependency injection works, not a bug.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
# No sqlalchemy mypy plugin: it requires every relationship() to also carry
# an explicit Mapped[...] annotation to be usable, which would mean
# touching every model for a checker-only benefit. app/db/base.py instead
# subclasses DeclarativeBase directly (SQLAlchemy 2.0's typed base),
# which mypy understands natively without a plugin.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Too strict for MVP, enable later
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "faster_whisper.*",
    "kokoro.*",
    "piper.*",
    "ollama.*",
    "twilio.*",
]
ignore_missing_imports = true
