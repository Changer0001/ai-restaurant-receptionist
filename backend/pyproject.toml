[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-restaurant-receptionist"
version = "0.1.0"
description = "Production-ready AI restaurant receptionist with local-first architecture"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Burak Yilmaz", email = "yilmmazburak@gmail.com"}
]

dependencies = [
    # Web Framework
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",

    # Database
    "sqlalchemy==2.0.23",
    "asyncpg==0.30.0",
    "alembic==1.12.1",
    "python-dateutil==2.8.2",  # required by alembic's file_template timezone support

    # Async / Cache
    # Note: aioredis is deprecated and abandoned upstream; on Python 3.11+
    # it crashes at import time (duplicate TimeoutError base class vs the
    # stdlib). redis-py >=4.2 ships the same asyncio API as `redis.asyncio`,
    # so that's what app/core/cache.py uses instead.
    "redis==5.0.1",

    # Data Validation
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",

    # Security
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.1.1",

    # HTTP Client
    "httpx==0.25.1",
    "aiohttp==3.9.1",

    # AI/ML
    "ollama==0.1.0",
    "faster-whisper==0.10.0",
    "openai-whisper==20231117",  # For compatibility
    "transformers==4.36.0",
    "torch==2.1.1",
    "numpy==1.26.3",

    # Vector DB
    "chromadb==0.4.21",

    # TTS
    "piper-tts==1.2.0",

    # Audio Processing
    # (WAV container handling uses the stdlib `wave` module directly —
    # no separate package needed for that.)
    "librosa==0.10.0",
    "soundfile==0.12.1",

    # Telephony
    "twilio==8.10.0",

    # Monitoring
    "prometheus-client==0.19.0",

    # Logging
    "python-json-logger==2.0.7",

    # Utilities
    "python-dotenv==1.0.0",
    "pyyaml==6.0.1",
    "tenacity==8.2.3",

    # Email
    "aiosmtplib==3.0.1",
    "email-validator==2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "black==23.12.0",
    "ruff==0.1.8",
    "mypy==1.7.1",
    "types-redis==4.6.0.11",
    "types-aiofiles==23.2.0",
    "httpx[cli]==0.25.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
select = [
    "E",   # Pycodestyle errors
    "W",   # Pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
# E501 (line too long) is redundant with the line-length setting above;
# W503 (line break before binary operator) doesn't exist as a ruff rule
# code — it's a flake8-only code for a style flake8 itself now considers
# non-idiomatic — so listing it here made ruff refuse to start at all.
# B008 (function call in argument default) is FastAPI's own `Depends(...)`
# idiom — it's how dependency injection works, not a bug.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
# No sqlalchemy mypy plugin: it requires every relationship() to also carry
# an explicit Mapped[...] annotation to be usable, which would mean
# touching every model for a checker-only benefit. app/db/base.py instead
# subclasses DeclarativeBase directly (SQLAlchemy 2.0's typed base),
# which mypy understands natively without a plugin.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Too strict for MVP, enable later
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "faster_whisper.*",
    "piper.*",
    "ollama.*",
]
ignore_missing_imports = true
