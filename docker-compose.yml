version: '3.9'

services:
  # ============================================================================
  # INFRASTRUCTURE
  # ============================================================================

  postgres:
    image: postgres:16-alpine
    container_name: restaurant_ai_postgres
    environment:
      POSTGRES_USER: restaurantai
      POSTGRES_PASSWORD: restaurantai
      POSTGRES_DB: restaurantai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurantai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: restaurant_ai_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  chromadb:
    # Pinned (not `:latest`, which drifts forward on every fresh pull
    # while backend/pyproject.toml's Python client stays pinned to an
    # exact chromadb==0.4.21 — see that file's own comments) to a
    # server version verified compatible with that exact client:
    #   - Its REST API still serves /api/v1/tenants/{tenant} etc. — the
    #     0.4.21 client's actual calls (ChromaDB broke this in later
    #     major versions, moving to /api/v2/...).
    #   - Its own server code doesn't crash on import: 0.4.21 through
    #     0.5.5's chromadb/api/types.py uses `np.float_`, removed in
    #     NumPy 2.0 — every one of those *server* image builds crashes
    #     on startup against a NumPy 2.0 bundled inside the image
    #     itself (a real user hit this first, pinning to plain 0.4.21).
    #     Verified by downloading and inspecting the actual PyPI wheel
    #     source for each 0.4.x/0.5.x release: fixed starting at 0.5.7,
    #     which is also the earliest version confirmed (same method)
    #     to still serve the v1 API routes above.
    image: ghcr.io/chroma-core/chroma:0.5.7
    container_name: restaurant_ai_chromadb
    environment:
      # CHROMA_DB_IMPL (duckdb) is 0.3.x-era config, silently ignored by
      # 0.5.7's server — verified in its own chromadb/config.py, where
      # `is_persistent` defaults to False. IS_PERSISTENT is the current
      # env var that actually enables on-disk (rather than in-memory)
      # storage; without it, data wouldn't survive a container restart.
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/data
    ports:
      - "8011:8000"
    volumes:
      - chromadb_data:/chroma/data
    healthcheck:
      # /api/version (no version prefix) is not a real route on 0.5.7 —
      # confirmed by inspecting its own chromadb/server/fastapi/__init__.py,
      # which only registers /api/v1/version and /api/v1/heartbeat. The
      # bare path 404s even though the server itself is healthy, which
      # left this container permanently reporting "unhealthy" — hit live
      # running this exact compose file.
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================================================
  # AI SERVICES
  # ============================================================================

  ollama:
    image: ollama/ollama:latest
    container_name: restaurant_ai_ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU reservation below requires the NVIDIA Container Toolkit (see
    # docs/setup.md). Remove the `deploy:` block entirely to run on CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  # ============================================================================
  # BACKEND API
  # ============================================================================

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurant_ai_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://restaurantai:restaurantai@postgres:5432/restaurantai
      - REDIS_URL=redis://redis:6379/0
      - VECTOR_DB_URL=http://chromadb:8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=INFO
    # No `ports:` mapping — the API must only be reachable through Nginx
    # (port 80/443), never published directly to the host. This is a real
    # security boundary, not just tidiness: this project's Twilio webhook
    # signature validation trusts X-Forwarded-Proto from whoever reaches
    # uvicorn directly (see --forwarded-allow-ips below) to reconstruct
    # the https:// URL Twilio actually signed against; if this port were
    # also published to the host, a caller reaching it directly (bypassing
    # Nginx) could forge that header and defeat signature validation
    # entirely. Use `docker compose exec api <cmd>` for direct access
    # during development instead of a published port.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
    # GPU access for local AI inference
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    # --proxy-headers makes uvicorn trust X-Forwarded-Proto/-For from
    # Nginx, so request.url reports the real https:// scheme Twilio
    # signed against rather than uvicorn's own plain-http connection to
    # Nginx — without it, webhook signature validation fails on every
    # real request in this reverse-proxied deployment.
    # --forwarded-allow-ips='*' trusts that header from any peer that can
    # reach this container; safe here specifically because this service
    # publishes no host port (see above) and is unreachable from outside
    # the docker-compose network, where every other container is part of
    # this same trust boundary. Scope this down to Nginx's actual address
    # in any topology where that assumption doesn't hold.
    command: >
      sh -c "
        alembic upgrade head &&
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
        --proxy-headers --forwarded-allow-ips='*'
      "

  # ============================================================================
  # NOTIFICATION WORKER
  # ============================================================================

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurant_ai_worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://restaurantai:restaurantai@postgres:5432/restaurantai
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    # No GPU reservation, no dependency on chromadb/ollama: this process
    # only sends the SMS/email notifications app/conversation/tools.py
    # already queued as Notification rows — it never touches AI
    # inference, so it doesn't need (or wait on) the services that do.
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - app-network
    command: python -m app.worker

  # ============================================================================
  # MONITORING
  # ============================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: restaurant_ai_prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: restaurant_ai_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - app-network

  # ============================================================================
  # FRONTEND
  # ============================================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: restaurant_ai_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    networks:
      - app-network
    command: npm run dev

  # ============================================================================
  # REVERSE PROXY
  # ============================================================================

  nginx:
    image: nginx:alpine
    container_name: restaurant_ai_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - api
      - frontend
    networks:
      - app-network

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chromadb_data:
    driver: local
  ollama_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_cache:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  app-network:
    driver: bridge
